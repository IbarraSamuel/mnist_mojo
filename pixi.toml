[workspace]
authors = ["Samuel Ibarra <Samuel.E.Ibarra@dell.com>"]
channels = ["https://prefix.dev/max-nightly", "https://prefix.dev/conda-forge"]
name = "mnist_mojo"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
train = "mojo -I src src/train.mojo"
train-gpu = "mojo -D USE_GPU=true -I src src/train.mojo"
predict = "mojo -I src src/predict.mojo"
test = "mojo -I src tests/test_mnist_ops.mojo"

[dependencies]
mojo = "*"
max = "*"
